groups:
  - name: flowmatix-infrastructure
    rules:
      # ── CPU Alert ──────────────────────────────────────────
      - alert: HighCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 5 minutes. Current: {{ $value | printf \"%.1f\" }}%"

      - alert: CriticalCpuUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 95%. Current: {{ $value | printf \"%.1f\" }}%"

      # ── RAM Alert ──────────────────────────────────────────
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 80% for more than 5 minutes. Current: {{ $value | printf \"%.1f\" }}%"

      - alert: CriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Critical memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 95%. Current: {{ $value | printf \"%.1f\" }}%"

      # ── API Latency Alert ─────────────────────────────────
      - alert: HighApiLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="flowmatix-api"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High API latency"
          description: "API p95 latency is above 2 seconds. Current: {{ $value | printf \"%.2f\" }}s"

      - alert: CriticalApiLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="flowmatix-api"}[5m])) by (le)) > 5
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Critical API latency"
          description: "API p95 latency is above 5 seconds. Current: {{ $value | printf \"%.2f\" }}s"

      # ── Container Restarts ─────────────────────────────────
      - alert: ContainerRestarting
        expr: increase(container_restart_count[1h]) > 3
        for: 0m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Container {{ $labels.name }} restarting frequently"
          description: "Container has restarted {{ $value }} times in the last hour"

      # ── Disk Space ─────────────────────────────────────────
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Less than 15% disk space remaining. Available: {{ $value | printf \"%.1f\" }}%"

  - name: flowmatix-application
    rules:
      # ── Database Connection Pool ───────────────────────────
      - alert: HighDatabaseConnections
        expr: pg_stat_activity_count{datname="flowmatix"} > 80
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High database connection count"
          description: "Active connections: {{ $value }}. Max is typically 100."

      # ── n8n Health ─────────────────────────────────────────
      - alert: N8nDown
        expr: probe_success{job="n8n-healthcheck"} == 0
        for: 2m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "n8n is down"
          description: "n8n health check has been failing for 2 minutes"

      # ── API Error Rate ─────────────────────────────────────
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{job="flowmatix-api", status=~"5.."}[5m])) / sum(rate(http_requests_total{job="flowmatix-api"}[5m])) * 100 > 5
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High API error rate"
          description: "API 5xx error rate is {{ $value | printf \"%.1f\" }}% (threshold: 5%)"
