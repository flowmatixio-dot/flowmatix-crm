global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: "default"
      repeat_interval: 4h

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://fm-api:4000/api/v1/internal/alerts"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "http://fm-api:4000/api/v1/internal/alerts"
        send_resolved: true
    email_configs:
      - to: "flowmatix.io@gmail.com"
        from: "partner@flowmatix.io"
        smarthost: "smtp.resend.com:587"
        auth_username: "resend"
        auth_password_file: "/etc/alertmanager/smtp_password"
        require_tls: true
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]
