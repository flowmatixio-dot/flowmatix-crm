global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: "default"
      repeat_interval: 4h

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://flowmatix-api:3001/api/v1/internal/alerts"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "http://flowmatix-api:3001/api/v1/internal/alerts"
        send_resolved: true
    # Add email/Telegram notification for critical alerts
    # email_configs:
    #   - to: "admin@flowmatix.io"
    #     from: "alerts@flowmatix.io"
    #     smarthost: "smtp.example.com:587"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]
